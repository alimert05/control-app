plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.alicontrol.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.alicontrol.app"
        minSdk 27
        targetSdk 27
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        // ExpiredTargetSdkVersion is a Google Play submission gate (Play
        // requires targetSdk 31+). This app is never distributed via Play —
        // it's sideloaded onto one specific Android 8.1 tablet, and
        // targetSdk 27 is a deliberate, project-wide requirement (see
        // README.md / TASKS.md), not an oversight. Everything else lint
        // finds still applies.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    // TASK-007: the officially-supported, lightweight paging widget behind
    // the dashboard's horizontal swipe navigation — no heavier than the
    // RecyclerView it's built on, and API-27-compatible.
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    testImplementation 'junit:junit:4.13.2'
}
